name: CI/CD Frontend - Docker Hub

on:
  push:
    branches:
      - main
      - develop
      - 'chore/**'
      - 'test/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend-pipeline:
    name: Build, Test e Push no Docker Hub
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend-angular

    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: src/frontend-angular/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: 3. Execução de testes automatizados
        run: npm run test -- --watch=false
        env:
          CI: true

      - name: 4. Execução de build do software (Frontend)
        run: npm run build

      - name: 5. Autenticação no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 6. Build da imagem Docker (Ambiente)
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/tevejo-frontend:latest .

      - name: 7. Push da imagem para o Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/tevejo-frontend:latest
