name: CI/CD Backend - Docker Hub

on:
  push:
    branches:
      - main
      - develop
      - 'chore/**'
      - 'test/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-e-testes:
    name: Build e Testes do Backend (Software)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend_django

    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: src/backend_django/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: 3. Execução de build do software (verificação do projeto Django)
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python -m compileall -q .

      - name: 4. Execução de testes automatizados
        run: python manage.py test

      - name: 5. Gerar artefato do backend
        run: tar --exclude='__pycache__' --exclude='*.sqlite3' -czf ../../tevejo-backend.tar.gz .

      - name: Publicar artefato no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: tevejo-backend
          path: tevejo-backend.tar.gz

  docker:
    name: Build e Push da Imagem Docker (Ambiente)
    runs-on: ubuntu-latest
    needs: build-e-testes
    if: github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: src/backend_django

    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      - name: 6. Autenticação no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 7. Build da imagem Docker (Ambiente)
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/tevejo-backend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/tevejo-backend:${{ github.sha }} .

      - name: 8. Push da imagem para o Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/tevejo-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/tevejo-backend:${{ github.sha }}
