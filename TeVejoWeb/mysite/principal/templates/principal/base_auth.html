<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Tevejo{% endblock %}</title>

  {% load static %}

  <!-- Bulma CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- CSS principal -->
  <link rel="stylesheet" href="{% static 'principal/css/principal.css' %}">
  <link rel="stylesheet" href="{% static 'principal/css/header.css' %}">

  <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@300;400;500;700&display=swap" rel="stylesheet">

  {% block extra_css %}{% endblock %}
</head>
<body>

  {% include 'principal/header.html' %}

  <main class="auth-wrapper-container">
    {% block content %}{% endblock %}
  </main>

  {% block extra_js %}{% endblock %}

  <style>
    :root{
      height: 0px;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .auth-wrapper-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5; /* preenche toda a tela */
      width: 100%;
      padding: 0;
    }
  </style>
</body>
</html>
