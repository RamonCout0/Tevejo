server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads de fotos/ícones/banners (até 5 MB + margem).
    client_max_body_size 10M;

    # API, admin, Swagger e mídias vão para o Django. BACKEND_URL vem do
    # ambiente (padrão no Dockerfile: serviço "backend" do compose; no Railway:
    # http://backend.railway.internal:8000).
    location ~ ^/(api|admin|static|media)/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer outra rota cai no index.html para o roteador do Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
