<div class="w-full max-w-3xl mx-auto space-y-5">
  <button type="button" class="tv-btn tv-btn-ghost tv-btn-sm -ml-2" (click)="cancelar()">
    <i class="fas fa-arrow-left text-xs" aria-hidden="true"></i> Voltar para a comunidade
  </button>

  <section class="tv-card tv-card-marca p-6 sm:p-8 pt-8 space-y-6" *ngIf="!carregando(); else carregandoTpl">
    <ng-container *ngIf="comunidade() as c">

      <header class="flex items-center gap-4 pb-5 min-w-0" style="border-bottom: 1px solid var(--tv-border-blue);">
        <div class="w-14 h-14 rounded-full p-[3px] shrink-0" style="background: var(--tv-gradiente-diagonal);">
          <div class="w-full h-full rounded-full overflow-hidden flex items-center justify-center"
               style="background: var(--color-tv-card); border: 2px solid var(--color-tv-card);">
            <img *ngIf="c.icone" [src]="c.icone" alt="" class="w-full h-full object-cover">
            <span *ngIf="!c.icone" class="tv-avatar w-full h-full" [ngClass]="c.nome | tomDaMarca">{{ c.nome | iniciais }}</span>
          </div>
        </div>
        <div class="min-w-0">
          <p class="tv-page-eyebrow">Nova postagem</p>
          <h1 class="tv-section-title mt-0.5 truncate" style="font-size: 1.35rem;" [title]="c.nome">
            em <span class="tv-texto-gradiente">{{ c.nome }}</span>
          </h1>
        </div>
      </header>

      <form (ngSubmit)="postar()" class="space-y-5" novalidate>

        <div>
          <label class="tv-label" for="pc-titulo">Título <span class="tv-required">*</span></label>
          <input id="pc-titulo" type="text" name="titulo"
                 [maxlength]="limites.postagemTitulo"
                 [(ngModel)]="titulo"
                 placeholder="Um título claro ajuda outras pessoas a entrarem na conversa"
                 [disabled]="enviando()"
                 class="tv-input">
          <span class="tv-contador" [class.tv-contador-alerta]="titulo.length >= limites.postagemTitulo * 0.9">
            {{ titulo.length }}/{{ limites.postagemTitulo }}
          </span>
        </div>

        <div>
          <label class="tv-label" for="pc-conteudo">Conteúdo <span class="tv-required">*</span></label>
          <app-editor-texto [(ngModel)]="conteudo" name="conteudo"
                            idCampo="pc-conteudo" rotulo="Conteúdo"
                            [limite]="limites.postagemConteudo" [linhas]="9"
                            [disabled]="enviando()"
                            placeholder="O que você quer compartilhar hoje?"></app-editor-texto>
        </div>

        <div *ngIf="erro() as msg" class="tv-alert tv-alert-error" role="alert">
          <i class="fas fa-circle-exclamation mt-[2px]" aria-hidden="true"></i>
          <span>{{ msg }}</span>
        </div>

        <div class="flex justify-end gap-3">
          <button type="button" class="tv-btn tv-btn-secondary" (click)="cancelar()" [disabled]="enviando()">
            Cancelar
          </button>
          <button type="submit" class="tv-btn tv-btn-primary"
                  [disabled]="enviando() || (!c.is_membro && !c.is_moderador)">
            <i class="fas fa-paper-plane" aria-hidden="true"></i>
            {{ enviando() ? 'Postando…' : 'Publicar' }}
          </button>
        </div>
      </form>
    </ng-container>
  </section>

  <ng-template #carregandoTpl>
    <div class="tv-loading-row" role="status" aria-live="polite">
      <span class="tv-dot-loader" aria-hidden="true"><span></span><span></span><span></span></span>
      <span>Carregando comunidade…</span>
    </div>
  </ng-template>
</div>
